# Cloudflare Workers (static assets) deploy for this zfb example.
#
#   build  — always runs (push + PR): install, typecheck (`zfb check`), build
#            (`zfb build`). This is the L3 build-output gate; it needs no
#            Cloudflare credentials, so a fresh clone/fork is green immediately.
#   deploy — push to `main` only: runs `wrangler deploy`, but SELF-SKIPS when
#              * secrets.CLOUDFLARE_API_TOKEN is unset, or
#              * wrangler.toml still holds a REPLACE_WITH_* placeholder id.
#            So the repo never shows a red deploy before Cloudflare is wired up.
#   smoke  — after a real deploy: hits the live custom domain and checks the
#            page and the summarize route. The script can self-skip (exit 0)
#            while a domain does not resolve yet, for the same
#            never-red-before-wired reason — but this repo's domain IS attached
#            and serving, so the step sets SMOKE_REQUIRE_LIVE=1 and an
#            unreachable site fails the run instead of passing quietly.
#
# Enable deploys by adding, in repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token with Account · Workers Scripts: Edit
#                          (+ Workers AI: Read for the `AI` binding, and
#                          Account Settings: Read). No KV or D1 here.
#                          ALSO Zone · Workers Routes: Edit on the
#                          takazudomodular.com zone — wrangler.toml attaches a
#                          custom domain, and creating that route is a
#                          zone-scoped operation the account permissions above
#                          do not cover.
#   CLOUDFLARE_ACCOUNT_ID  target Cloudflare account id
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (typecheck + zfb build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add it and CLOUDFLARE_ACCOUNT_ID in repo Settings to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q "REPLACE_WITH" wrangler.toml; then
            echo "::notice::wrangler.toml still has a REPLACE_WITH_* placeholder — provision the resource, commit the real id, then deploy will run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env ai
      # A green `wrangler deploy` only proves the Worker uploaded. The
      # custom-domain route is a separate resource, so only a real request over
      # the real hostname proves the site is actually serving.
      - name: Smoke test the live site
        if: steps.preflight.outputs.ready == 'true'
        env:
          # zfb-example-ai-summarizer.takazudomodular.com is attached and
          # serving, so the script's not-wired-up-yet skip no longer describes
          # anything that can truthfully happen here. Requiring live turns those
          # conditions back into the failures they now are.
          SMOKE_REQUIRE_LIVE: "1"
        run: node scripts/smoke.mjs
