# Cloudflare Workers Static Assets configuration.
#
# READ THIS FIRST — this project deploys the NAMED `ai` ENVIRONMENT, not the
# top-level worker. `.github/workflows/deploy.yml` runs
# `wrangler deploy --env ai`, so the live production Worker is
# `zfb-example-ai-summarizer-ai` (see [env.ai] near the bottom). That is why the
# custom-domain route is declared as [[env.ai.routes]] and NOT as a top-level
# [[routes]]: a top-level route would attach the domain to the
# `zfb-example-ai-summarizer` Worker, which is never deployed.

name = "zfb-example-ai-summarizer"
main = "./dist/_worker.js"
compatibility_date = "2026-05-01"

# nodejs_compat is required by the CF adapter bundle at dist/_worker.js, which
# imports node:async_hooks (AsyncLocalStorage). Without this flag wrangler
# refuses to load the worker even when dist/_worker.js exists.
compatibility_flags = ["nodejs_compat"]

# Top-level fields — these MUST stay ABOVE the [assets] table. In TOML any key
# after a table header is scoped INTO that table, so placed below [assets] these
# would draw an "Unexpected fields found in assets field" warning and be
# silently ignored.
#
# Unlike bindings and [vars], these two settings ARE inherited by named
# environments, so they reach [env.ai] without being restated there.
#
# workers_dev keeps the public *.workers.dev subdomain
# (zfb-example-ai-summarizer-ai.takazudo.workers.dev) serving alongside the
# custom domain below. It is also REQUIRED for preview-alias URLs to route: with
# it disabled Cloudflare still PRINTS the preview URL at upload time, but the
# edge rejects requests to it with "error code: 1042".
workers_dev = true

# preview_urls enables the *.workers.dev version-preview URLs. It defaults to
# MATCH workers_dev, so leaving it implicit is exactly how previews silently
# disappear the day someone sets workers_dev = false. Always state it outright.
preview_urls = true

# ---------------------------------------------------------------------------
# Static asset serving
#
# not_found_handling = "404-page" serves dist/404.html for unmatched GETs.
#
# run_worker_first = false consults the asset layer before the worker script;
# the worker runs only when no matching asset is found. That is safe for the
# POST /api/summarize route — the asset layer only ever serves GET/HEAD, so
# non-GET requests always reach the worker regardless of this setting.
#
# .assetsignore: the zfb Cloudflare adapter writes dist/.assetsignore at build
# time listing _worker.js and _zfb_inner.mjs, keeping them out of the public
# asset store instead of serving them as downloadable files. It is generated by
# the build, not committed.
# ---------------------------------------------------------------------------
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = false

# ---------------------------------------------------------------------------
# The `ai` environment — THE environment that actually gets deployed.
#
# Bindings are NOT inherited from the top level into a named environment, so the
# AI binding is declared here. Naming the env also renames the deployed Worker.
# ---------------------------------------------------------------------------
[env.ai]
name = "zfb-example-ai-summarizer-ai"

[env.ai.ai]
binding = "AI"

# Custom-domain route — on the `ai` env because that is what the deploy workflow
# ships. custom_domain = true has Cloudflare create and manage the DNS record
# and TLS certificate for this hostname. Creating it requires a token carrying
# `Zone · Workers Routes · Edit` on the takazudomodular.com zone, on top of the
# account-scoped Workers permissions.
[[env.ai.routes]]
pattern = "zfb-example-ai-summarizer.takazudomodular.com"
custom_domain = true
